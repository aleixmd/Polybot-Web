<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px 28px;
}
header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #21262d;
}
header h1 { font-size: 18px; font-weight: 700; color: #e6edf3; }
#summary { font-size: 12px; color: #8b949e; }
.spacer { flex: 1; }
#last-updated { font-size: 12px; color: #8b949e; }
#refresh-btn {
  padding: 5px 13px; background: #21262d; border: 1px solid #30363d;
  border-radius: 6px; color: #c9d1d9; cursor: pointer; font-size: 13px;
}
#refresh-btn:hover { background: #30363d; }

#root { display: flex; flex-direction: column; gap: 14px; }

.city-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden;
}
.city-card.risk-critical { border-color: #f85149; }
.city-card.risk-high     { border-color: #f0883e; }
.city-card.risk-medium   { border-color: #e3b341; }
.city-card.risk-won      { border-color: #3fb950; }

.card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-bottom: 1px solid #21262d;
}
.city-name { font-size: 17px; font-weight: 700; color: #e6edf3; }
.city-stats { font-size: 12px; color: #8b949e; display: flex; gap: 12px; }
.city-stats b { color: #c9d1d9; }
.risk-badge {
  margin-left: auto; padding: 3px 10px; border-radius: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
}
.badge-critical { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.3); }
.badge-high     { background: rgba(240,136,62,0.15); color: #f0883e; border: 1px solid rgba(240,136,62,0.3); }
.badge-medium   { background: rgba(227,179,65,0.15); color: #e3b341; border: 1px solid rgba(227,179,65,0.3); }
.badge-low      { background: rgba(63,185,80,0.12);  color: #3fb950; border: 1px solid rgba(63,185,80,0.25); }
.badge-won      { background: rgba(63,185,80,0.20);  color: #3fb950; border: 1px solid rgba(63,185,80,0.5); }

.card-body { display: grid; grid-template-columns: 1fr 320px; }
.chart-wrap {
  padding: 14px 16px; border-right: 1px solid #21262d;
  position: relative; height: 220px;
}
.chart-wrap canvas { width: 100% !important; height: 100% !important; }
.chart-src { position: absolute; bottom: 4px; right: 8px; font-size: 9px; color: #30363d; pointer-events: none; }
.chart-no-data {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 6px; color: #484f58; font-size: 12px;
}
.chart-no-data .icon { font-size: 20px; opacity: 0.6; }

.bets-panel { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.bet-row {
  display: grid; grid-template-columns: auto 1fr auto auto;
  align-items: center; gap: 8px; padding: 8px 10px;
  border-radius: 6px; background: #1c2128; border: 1px solid #30363d;
}
.bet-row.at-risk { border-color: rgba(248,81,73,0.5);  background: rgba(248,81,73,0.05); }
.bet-row.warning { border-color: rgba(227,179,65,0.4); background: rgba(227,179,65,0.04); }
.bet-row.won     { border-color: rgba(63,185,80,0.45); background: rgba(63,185,80,0.06); }

.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.badge-yes { background: rgba(63,185,80,0.12);  color: #3fb950; }
.badge-no  { background: rgba(248,81,73,0.12);  color: #f85149; }

.bet-threshold { font-size: 13px; font-weight: 600; color: #e6edf3; }
.bet-threshold .op { font-size: 11px; color: #8b949e; margin-right: 2px; }
.bet-margin { font-size: 12px; font-weight: 600; text-align: right; }
.margin-safe { color: #3fb950; }
.margin-warn { color: #e3b341; }
.margin-risk { color: #f85149; }
.bet-meta { font-size: 11px; color: #8b949e; line-height: 1.5; text-align: right; }
.bet-meta b { color: #c9d1d9; }

.loading { text-align: center; padding: 60px; color: #8b949e; font-size: 14px; }
.no-positions { text-align: center; padding: 40px; color: #8b949e; }

@media (max-width: 760px) {
  .card-body { grid-template-columns: 1fr; }
  .chart-wrap { border-right: none; border-bottom: 1px solid #21262d; }
  .bets-panel { max-height: 300px; }
  body { padding: 14px; }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseTitle(title) {
  const cityM = title.match(/temperature in ([A-Za-z\s\-]+?) be/i);
  const cityName = cityM ? cityM[1].trim() : '';
  const citySlug = cityName.toLowerCase().replace(/\bnyc\b/i, 'nyc').replace(/\s+/g, '-');
  const thrM = title.match(/be (-?\d+(?:\.\d+)?)°?([CF])/i);
  const threshold = thrM ? parseFloat(thrM[1]) : null;
  const unit = thrM ? thrM[2].toUpperCase() : 'C';
  const isOrHigher = title.toLowerCase().includes('or higher');
  const thresholdC = (threshold !== null && unit === 'F') ? (threshold - 32) * 5 / 9 : threshold;
  return { cityName, citySlug, threshold, unit, isOrHigher, thresholdC };
}

function getLocalHour(tz) {
  try {
    const now   = new Date();
    const parts = new Intl.DateTimeFormat('en', {
      timeZone: tz, hour: 'numeric', minute: 'numeric', hour12: false
    }).formatToParts(now);
    const h = parseInt(parts.find(p => p.type === 'hour')?.value   ?? '0') % 24;
    const m = parseInt(parts.find(p => p.type === 'minute')?.value ?? '0');
    return h + (m >= 30 ? 0.5 : 0);
  } catch {
    const now = new Date();
    return now.getUTCHours() + (now.getUTCMinutes() >= 30 ? 0.5 : 0);
  }
}

// Filter: only keep positions whose endDate is today or future (UTC date comparison)
function isCurrentOrFuture(p) {
  const dateStr = p.endDate || p.endDateIso || p.startDate || null;
  if (!dateStr) return true; // no date info → keep
  const todayUTC = new Date().toISOString().slice(0, 10);
  return dateStr.slice(0, 10) >= todayUTC;
}

function marginClass(d) {
  if (d <= 1) return 'margin-risk'; // ≤1°C from threshold → red
  if (d <= 2) return 'margin-warn';
  return 'margin-safe';
}

function riskInfo(minDist, allWon) {
  if (allWon)       return { label: 'WON',     cls: 'badge-won',      cardCls: 'risk-won',      sort: -1 };
  if (minDist <= 1) return { label: 'AT RISK', cls: 'badge-critical', cardCls: 'risk-critical', sort: 0 };
  if (minDist <= 2) return { label: 'HIGH',    cls: 'badge-high',     cardCls: 'risk-high',     sort: 1 };
  if (minDist <= 3) return { label: 'MEDIUM',  cls: 'badge-medium',   cardCls: 'risk-medium',   sort: 2 };
  return                 { label: 'LOW',     cls: 'badge-low',      cardCls: '',              sort: 3 };
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── API: Positions ────────────────────────────────────────────────────────────
async function fetchPositions() {
  const r = await fetch(
    `https://data-api.polymarket.com/positions?user=${WALLET}&limit=500&sizeThreshold=0`
  );
  return r.json();
}

// ── API: WunderGround via VM proxy ────────────────────────────────────────────
const WU_API = 'http://141.148.229.17:5555/wunder';

async function fetchWU(icao) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 100_000);
  try {
    const r    = await fetch(`${WU_API}?icao=${icao}`, { signal: ctrl.signal });
    const data = await r.json();
    // Keys are 30-min float slots: "10.0", "10.5" → 10, 10.5
    const hourly = data.hourly ?? {};
    return {
      hourly:      Object.fromEntries(Object.entries(hourly).map(([k, v]) => [parseFloat(k), v])),
      currentTempC: data.current_temp_c ?? null,
    };
  } catch { return { hourly: {}, currentTempC: null }; }
  finally { clearTimeout(timer); }
}

// ── API: Open-Meteo (forecast + gap fill) ────────────────────────────────────
async function fetchOM(lat, lon, tz) {
  const url = new URL('https://api.open-meteo.com/v1/forecast');
  url.searchParams.set('latitude',         lat);
  url.searchParams.set('longitude',        lon);
  url.searchParams.set('timezone',         tz);
  url.searchParams.set('hourly',           'temperature_2m');
  url.searchParams.set('temperature_unit', 'celsius');
  url.searchParams.set('forecast_days',    '1');
  url.searchParams.set('past_days',        '0');

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    return r.json();
  } finally { clearTimeout(timer); }
}

async function fetchOMWithRetry(lat, lon, tz) {
  try { return await fetchOM(lat, lon, tz); }
  catch { await delay(700); return fetchOM(lat, lon, tz); }
}

// ── Chart ─────────────────────────────────────────────────────────────────────
const _charts = {};

function renderChart(canvasId, slots, pastTemps, fcastTemps, currentSlot, threshLines) {
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  if (_charts[canvasId]) _charts[canvasId].destroy();

  const nowIdx    = Math.round(currentSlot * 2);
  const pastData  = slots.map(s => s < currentSlot  ? (pastTemps[s]  ?? null) : null);
  const fcastData = slots.map(s => s >= currentSlot ? (fcastTemps[s] ?? null) : null);
  if (nowIdx < slots.length) {
    pastData[nowIdx]  = fcastTemps[currentSlot] ?? pastTemps[currentSlot] ?? null;
    fcastData[nowIdx] = pastData[nowIdx];
  }

  const allVals = [
    ...Object.values(pastTemps), ...Object.values(fcastTemps),
    ...threshLines.map(t => t.value),
  ].filter(v => v != null && isFinite(v));
  if (allVals.length === 0) return;

  const yMin = Math.floor(Math.min(...allVals)) - 1;
  const yMax = Math.ceil(Math.max(...allVals)) + 1;

  const nowPlugin = {
    id: 'nowLine_' + canvasId,
    beforeDraw(chart) {
      const c = chart.ctx, xs = chart.scales.x, ys = chart.scales.y;
      const px = xs.getPixelForValue(nowIdx);
      c.save(); c.strokeStyle = 'rgba(200,200,200,0.2)'; c.lineWidth = 1;
      c.setLineDash([3,4]); c.beginPath();
      c.moveTo(px, ys.top); c.lineTo(px, ys.bottom); c.stroke(); c.restore();
    }
  };

  _charts[canvasId] = new Chart(ctx, {
    type: 'line', plugins: [nowPlugin],
    data: {
      labels: slots.map(s => s % 1 ? '' : Math.floor(s) + 'h'),
      datasets: [
        ...threshLines.map(t => ({
          label: t.label, data: slots.map(() => t.value),
          borderColor: t.color, borderWidth: 1.5,
          borderDash: [5,4], pointRadius: 0, fill: false, tension: 0,
        })),
        { label: 'Observed', data: pastData,
          borderColor: '#58a6ff', borderWidth: 2.5,
          pointRadius: 0, pointHoverRadius: 4, fill: false, tension: 0.3, spanGaps: false },
        { label: 'Forecast (OM)', data: fcastData,
          borderColor: '#8b949e', borderWidth: 1.5, borderDash: [4,4],
          pointRadius: 0, pointHoverRadius: 4, fill: false, tension: 0.3, spanGaps: false },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#8b949e', bodyColor: '#e6edf3', padding: 8,
          filter: item => item.parsed.y !== null,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}°C` }
        }
      },
      scales: {
        x: {
          grid: { color: '#1c2128' },
          ticks: {
            color: '#8b949e', font: { size: 10 }, maxRotation: 0,
            callback: (val, idx) => {
              const s = slots[idx];
              if (s === undefined || s % 2 !== 0) return null;
              return Math.floor(s) + 'h';
            }
          }
        },
        y: { min: yMin, max: yMax, grid: { color: '#1c2128' },
             ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v + '°' } }
      }
    }
  });
}

// ── Risk distance for a single NO bet ─────────────────────────────────────────
// Returns distance-from-losing: large positive = safe, ≤1 = AT RISK, ≤2 = HIGH, ≤3 = MEDIUM
// isOrHigher=true  → "≥ X" NO: win if temp stays BELOW X all day
// isOrHigher=false → "= X" NO: win if daily max ≠ X (clearly below OR clearly above)
function calcDist(thresholdC, isOrHigher, currentT, maxObs, fcastTemps, currentSlot) {
  if (isOrHigher) {
    // Late in day + still well below threshold → effectively won
    if (currentSlot >= 18 && maxObs !== null && thresholdC - maxObs >= 2.5) return 10;
    const curr = currentT ?? maxObs;
    if (curr === null) return Infinity;
    return thresholdC - curr; // positive = safe margin, ≤1 = AT RISK
  }

  // "= X" NO: risk is that daily max peaks right at threshold
  const curr = currentT ?? maxObs;
  if (curr === null) return Infinity;

  const absDiff = Math.abs(curr - thresholdC);

  const allFcastVals = Object.values(fcastTemps);
  const maxFcast = allFcastVals.length ? Math.max(...allFcastVals) : null;
  const futureFcast = Object.entries(fcastTemps)
    .filter(([h]) => parseInt(h) > currentSlot)
    .map(([, v]) => v);

  // Forecast daily max is 2°C+ above threshold → temp will clearly exceed X → max won't be exactly X → SAFE
  if (maxFcast !== null && maxFcast >= thresholdC + 2) return 10;

  // Late afternoon + temp clearly below threshold: won't reach X
  if (currentSlot >= 15 && curr < thresholdC - 2) {
    const staysNear = futureFcast.length > 0 && futureFcast.every(v => Math.abs(v - thresholdC) <= 1.5);
    if (!staysNear) return 10;
  }

  // Remaining forecast hours all hovering near threshold → AT RISK (may plateau at X)
  if (futureFcast.length > 0 && futureFcast.every(v => Math.abs(v - thresholdC) <= 1)) {
    return 0.5;
  }

  // Morning (< 13h): temp hasn't peaked yet, add buffer — 2°C away is not yet concerning
  if (currentSlot < 13) return absDiff + 2;

  // Afternoon: use raw distance (≤1 = AT RISK, user said 1°C after 14h is the danger zone)
  return absDiff;
}

// ── Card builder ──────────────────────────────────────────────────────────────
function buildCard(cityName, citySlug, positions, iemTemps, omData, wuCurrentTemp = null) {
  const meta = CITIES[citySlug];
  const tz   = meta?.tz ?? 'UTC';
  const currentSlot = getLocalHour(tz); // float: 10=10:00, 10.5=10:30
  const slots = Array.from({ length: 48 }, (_, i) => i * 0.5); // 0, 0.5, 1, ..., 23.5

  // Past: WU observations (30-min slots). Gaps + future: OM hourly.
  const pastTemps  = { ...iemTemps };
  const fcastTemps = {};
  const omTimes = omData?.hourly?.time ?? [];
  const omTemps = omData?.hourly?.temperature_2m ?? [];
  omTimes.forEach((t, i) => {
    const h = parseInt(t.slice(11, 13)); // OM is hourly → integer slots
    const v = omTemps[i];
    if (v == null) return;
    if (h > currentSlot)        fcastTemps[h] = v;
    else if (!(h in pastTemps)) pastTemps[h]  = v; // fill WU gap with OM
  });
  const omCurrH = Math.floor(currentSlot);
  const omCurr  = omTemps[omCurrH];
  if (omCurr != null) {
    if (!(currentSlot in pastTemps)) pastTemps[currentSlot] = omCurr;
    fcastTemps[currentSlot] = omCurr;
  }
  // WU live current reading overrides OM for the current slot
  if (wuCurrentTemp !== null) pastTemps[currentSlot] = wuCurrentTemp;

  // Interpolate missing :30 slots from adjacent integer-hour data (OM is hourly,
  // WU may be hourly too — this gives smooth lines for both observed and forecast)
  for (let h = 0; h < 23; h++) {
    const half = h + 0.5;
    if (!(half in pastTemps)  && (h in pastTemps)  && ((h + 1) in pastTemps))
      pastTemps[half]  = Math.round(((pastTemps[h]  + pastTemps[h + 1])  / 2) * 10) / 10;
    if (!(half in fcastTemps) && (h in fcastTemps) && ((h + 1) in fcastTemps))
      fcastTemps[half] = Math.round(((fcastTemps[h] + fcastTemps[h + 1]) / 2) * 10) / 10;
  }

  const pastVals  = Object.values(pastTemps);
  const fcastVals = Object.values(fcastTemps);
  const maxObs    = pastVals.length  ? Math.max(...pastVals)  : null;
  const maxFcast  = fcastVals.length ? Math.max(...fcastVals) : null;

  // Most recent observed temperature
  const currentT  = pastTemps[currentSlot] ?? pastTemps[currentSlot - 0.5] ?? null;

  const hasTemp   = pastVals.length > 0 || fcastVals.length > 0;
  const effMax    = hasTemp ? Math.max(maxObs ?? -Infinity, maxFcast ?? -Infinity) : null;
  const hasIEM    = Object.keys(iemTemps).length > 0;
  const srcLabel  = hasIEM ? 'WU' : (hasTemp ? 'OM' : null);

  // Sort positions by threshold descending (hottest first)
  const parsed = positions
    .map(p => ({ ...p, ...parseTitle(p.title) }))
    .sort((a, b) => (b.threshold ?? 0) - (a.threshold ?? 0));

  const threshLines = [];
  let minDist  = Infinity;
  let wonCount = 0;
  let noCount  = 0;

  parsed.forEach(p => {
    if (p.thresholdC == null) return;
    const isNo = p.outcome === 'No';

    let dist;
    if (isNo) {
      if (currentT !== null || maxObs !== null) {
        dist = calcDist(p.thresholdC, p.isOrHigher, currentT, maxObs, fcastTemps, currentSlot);
      } else if (p.curPrice != null) {
        dist = (p.curPrice - 0.5) * 4.0; // price fallback
      } else {
        dist = Infinity;
      }
    } else {
      dist = effMax !== null ? p.thresholdC - effMax : Infinity; // YES bets (not used for risk)
    }

    if (isNo) {
      minDist = Math.min(minDist, dist);
      noCount++;
      // "≥ X" NO: effectively won if late + well below threshold
      // "= X" NO: won when real observed max clearly surpassed threshold
      const isWon = p.isOrHigher
        ? (currentSlot >= 18 && maxObs !== null && p.thresholdC - maxObs >= 2.5)
        : (maxObs !== null && maxObs > p.thresholdC + 1.0);
      if (isWon) wonCount++;
    }

    let color = '#58a6ff';
    if (isNo) {
      color = dist <= 0 ? '#f85149' : dist <= 1 ? '#f0883e' : dist <= 2 ? '#e3b341' : '#3fb950';
    }
    const label = `${isNo ? 'NO' : 'YES'} ${p.isOrHigher ? '≥' : '='}${p.threshold}°${p.unit}`;
    if (!threshLines.find(t => Math.abs(t.value - p.thresholdC) < 0.1)) {
      threshLines.push({ label, value: p.thresholdC, color });
    }
  });

  const allWon = noCount > 0 && wonCount === noCount;
  const risk   = riskInfo(minDist === Infinity ? 999 : minDist, allWon);
  const canvasId = 'chart-' + citySlug + '-' + Date.now();

  // ── Bet rows ──
  const betRows = parsed.map(p => {
    const isNo  = p.outcome === 'No';
    const isWon = isNo && (p.isOrHigher
      ? (currentSlot >= 18 && maxObs !== null && p.thresholdC - maxObs >= 2.5)
      : (maxObs !== null && maxObs > p.thresholdC + 1.0));

    let dist = null, priceFallback = false;
    if (isNo && p.thresholdC != null) {
      if (currentT !== null || maxObs !== null) {
        dist = calcDist(p.thresholdC, p.isOrHigher, currentT, maxObs, fcastTemps, currentSlot);
      } else if (p.curPrice != null) {
        dist = (p.curPrice - 0.5) * 4.0;
        priceFallback = true;
      }
    }

    // Display number: currentTemp - threshold (how far current temp is from the target)
    const diff = (currentT !== null && p.thresholdC !== null) ? currentT - p.thresholdC : null;

    const rowCls = isWon ? 'won' : (dist !== null ? (dist <= 1 ? 'at-risk' : dist <= 2.5 ? 'warning' : '') : '');
    const op     = p.isOrHigher ? '≥' : '=';

    let distStr;
    if (isWon) {
      distStr = `<span class="bet-margin margin-safe" style="font-weight:700">WON ✓</span>`;
    } else if (dist === null || diff === null) {
      distStr = `<span class="bet-margin" style="color:#8b949e">–</span>`;
    } else if (priceFallback) {
      distStr = `<span class="bet-margin ${marginClass(dist)}" title="Market price (no temp data)">${((p.curPrice ?? 0.5) * 100).toFixed(0)}¢</span>`;
    } else {
      // Show signed currentTemp - threshold; color based on risk dist
      distStr = `<span class="bet-margin ${marginClass(dist)}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}°C</span>`;
    }

    const pnl       = p.cashPnl  || 0;
    const size      = p.size     || 0;
    const curPriceF = p.curPrice || 0;
    // Total profit from entry if bet resolves in our favor (each share pays $1)
    const winProfit = isNo ? size * (1.0 - curPriceF) + pnl : null;

    const pnlCls = pnl >= 0 ? 'color:#3fb950' : 'color:#f85149';
    const pnlStr = (pnl >= 0 ? '+' : '') + '$' + Math.abs(pnl).toFixed(2);
    const sizeStr = size > 0 ? `×${Number.isInteger(size) ? size : size.toFixed(1)}` : '';

    let winLine = '';
    if (winProfit !== null) {
      const winCls = winProfit >= 0 ? 'color:#3fb950' : 'color:#f85149';
      const winStr = (winProfit >= 0 ? '+' : '') + '$' + Math.abs(winProfit).toFixed(2);
      winLine = `<span style="${winCls};font-size:10px">${winStr} if win</span><br>`;
    }

    return `<div class="bet-row ${rowCls}">
      <span class="badge ${isNo ? 'badge-no' : 'badge-yes'}">${p.outcome.toUpperCase()}</span>
      <span class="bet-threshold"><span class="op">${op}</span>${p.threshold}°${p.unit}</span>
      ${distStr}
      <div class="bet-meta">
        <b>${(curPriceF * 100).toFixed(1)}¢</b> <span style="color:#8b949e;font-size:11px;font-weight:600">${sizeStr}</span><br>
        ${winLine}<span style="${pnlCls};font-size:10px">${pnlStr} P&L</span>
      </div>
    </div>`;
  }).join('');

  const curStr   = currentT != null ? currentT.toFixed(1) + '°C' : '–';
  const maxStr   = maxObs   != null ? maxObs.toFixed(1)   + '°C' : '–';
  const fcastStr = maxFcast != null ? maxFcast.toFixed(1) + '°C' : '–';

  const chartContent = hasTemp
    ? `<canvas id="${canvasId}"></canvas><div class="chart-src">${srcLabel}</div>`
    : `<div class="chart-no-data"><span class="icon">⚡</span><span>Temp data unavailable</span><span style="font-size:11px">Risk from market price</span></div>`;

  const cardHtml = `
    <div class="city-card ${risk.cardCls}" data-sort="${risk.sort}">
      <div class="card-header">
        <span class="city-name">${cityName}</span>
        <div class="city-stats">
          <span>Now: <b>${curStr}</b></span>
          <span>Max obs: <b>${maxStr}</b></span>
          <span>Forecast max: <b>${fcastStr}</b></span>
        </div>
        <span class="risk-badge ${risk.cls}">${risk.label}</span>
      </div>
      <div class="card-body">
        <div class="chart-wrap">${chartContent}</div>
        <div class="bets-panel">${betRows || '<span style="color:#8b949e;font-size:13px">No bets</span>'}</div>
      </div>
    </div>`;

  return { html: cardHtml, canvasId, slots, pastTemps, fcastTemps, currentSlot, threshLines, sort: risk.sort, minDist, hasTemp };
}

// ── Main ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻ Loading…'; btn.disabled = true;
  document.getElementById('summary').textContent = 'Fetching positions…';

  try {
    const allPositions = await fetchPositions();
    if (!Array.isArray(allPositions) || allPositions.length === 0) {
      document.getElementById('root').innerHTML = '<div class="no-positions">No open positions found.</div>';
      document.getElementById('summary').textContent = '0 bets';
      return;
    }

    // Only show today's positions (filter out past-day markets by endDate)
    const positions = allPositions.filter(isCurrentOrFuture);

    if (positions.length === 0) {
      document.getElementById('root').innerHTML = '<div class="no-positions">No positions for today.</div>';
      document.getElementById('summary').textContent = `0 today (${allPositions.length} total)`;
      return;
    }

    // Group by city
    const cityMap = {};
    for (const pos of positions) {
      const { cityName, citySlug } = parseTitle(pos.title);
      if (!citySlug) continue;
      if (!cityMap[citySlug]) cityMap[citySlug] = { cityName, positions: [] };
      cityMap[citySlug].positions.push(pos);
    }

    const slugs = Object.keys(cityMap);

    // Fetch WU (observed) + OM (forecast) per city — parallel within city, sequential between
    const iemMap = {}, wuCurrentMap = {}, omMap = {};
    for (let i = 0; i < slugs.length; i++) {
      const slug = slugs[i];
      const meta = CITIES[slug];
      document.getElementById('summary').textContent =
        `${positions.length} bets · Fetching temp ${i + 1}/${slugs.length}…`;

      const [wuRes, omRes] = await Promise.allSettled([
        meta?.icao ? fetchWU(meta.icao) : Promise.resolve({ hourly: {}, currentTempC: null }),
        meta       ? fetchOMWithRetry(meta.lat, meta.lon, meta.tz) : Promise.resolve(null),
      ]);

      const wu = wuRes.status === 'fulfilled' ? wuRes.value : { hourly: {}, currentTempC: null };
      iemMap[slug]       = wu.hourly;
      wuCurrentMap[slug] = wu.currentTempC;
      omMap[slug]        = omRes.status === 'fulfilled' ? omRes.value : null;

      if (i < slugs.length - 1) await delay(300);
    }

    // Filter each city's positions by LOCAL date (e.g. Wellington may already be tomorrow)
    const localDateFmt = (tz) => new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());

    slugs.forEach(slug => {
      const tz = CITIES[slug]?.tz ?? 'UTC';
      const localToday = localDateFmt(tz);
      cityMap[slug].positions = cityMap[slug].positions.filter(p => {
        const d = (p.endDate || p.endDateIso || p.startDate || '').slice(0, 10);
        return !d || d >= localToday;
      });
    });

    // Build + sort cards (most at risk first, WON cards go to bottom)
    const cards = slugs
      .filter(slug => cityMap[slug].positions.length > 0) // skip cities with no remaining positions
      .map(slug => buildCard(cityMap[slug].cityName, slug, cityMap[slug].positions, iemMap[slug], omMap[slug], wuCurrentMap[slug]))
      .sort((a, b) => a.sort - b.sort || a.minDist - b.minDist);

    document.getElementById('root').innerHTML = cards.map(c => c.html).join('');

    const wuOk = slugs.filter(s => Object.keys(iemMap[s]).length > 0).length;
    document.getElementById('summary').textContent =
      `${positions.length} bets · ${slugs.length} cities · WU ${wuOk}/${slugs.length}`;

    cards.forEach(c => {
      if (c.hasTemp) {
        renderChart(c.canvasId, c.slots, c.pastTemps, c.fcastTemps, c.currentSlot, c.threshLines);
      }
    });

    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML =
      `<div class="loading" style="color:#f85149">Error: ${e.message}</div>`;
    document.getElementById('summary').textContent = 'Error';
  } finally {
    btn.textContent = '↻ Refresh'; btn.disabled = false;
  }
}

loadAll();
</script>
